name: CI

# 所有 main 集成都经过 Pull Request；required checks 在合入前验证变更。
on:
  pull_request:

# 门禁只读取仓库内容，不授予写入权限。
permissions:
  contents: read

# 同一引用有新提交时取消旧运行，避免浪费 CI 资源和展示过期结果。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 两个平台独立运行，尽早暴露平台相关的构建和测试差异。
        os:
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run project checks
        # Makefile 是本地与 CI 的唯一门禁入口；构建产物无需保留在工作区。
        run: make check BINARY="$RUNNER_TEMP/dot"
